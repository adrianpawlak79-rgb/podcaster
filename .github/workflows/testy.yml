# Testy przy kazdym PR i kazdym wypchnieciu na main.
# Te same testy co Tests/wszystko.sh, przez Tests/ci.sh (kazdy osobno, z tabela).
# testy: zadnego mikrofonu, karty ani JUCE — tylko g++ i nasz DSP w naglowkach.
# testy-juce: to, co potrzebuje JUCE (pliki, ustawienia, panel ciec, Recorder)
# — Tests/juce-testy.sh na celach zbudowanych przez CMake.

name: Testy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Narzedzia
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ espeak-ng ffmpeg python3-pip
          python3 -m pip install --break-system-packages -q soundfile pyloudnorm

      - name: Tests/ci.sh
        env:
          CI_PODSUMOWANIE: ${{ runner.temp }}/podsumowanie.md
        run: |
          set +e
          bash Tests/ci.sh
          kod=$?
          cat "$CI_PODSUMOWANIE" >> "$GITHUB_STEP_SUMMARY"
          exit $kod

  testy-juce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Narzedzia
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ cmake ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: JUCE 7.0.12
        run: git clone -q --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE7"

      - name: Budowanie
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZS_JUCE_PATH="$RUNNER_TEMP/JUCE7"
          cmake --build build --target UstawieniaTest PunchPlikTest CieciaPanelTest RuntimeTest

      - name: Tests/juce-testy.sh
        env:
          CI_PODSUMOWANIE: ${{ runner.temp }}/juce.md
        run: |
          set +e
          bash Tests/juce-testy.sh build
          kod=$?
          cat "$CI_PODSUMOWANIE" >> "$GITHUB_STEP_SUMMARY"
          exit $kod
