# Symulacja calej sesji bez czlowieka (Tools/zs-scenariusz.py + Tools/zs-symulacja.cpp).
#
# Sztuczne nagranie z zapisana prawda przechodzi przez prawdziwe klasy programu
# (Recorder, prompter, lampka, R, wyciecie pomylek, ocena, miks); raport w
# podsumowaniu przebiegu. Na razie RAPORT, nie bramka: kilka znanych rozjazdow
# (Docs/badania/SYMULACJA.md) — przebieg nie oblewa PR-a.

name: Symulacja

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  symulacja:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Narzedzia
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ cmake ninja-build espeak-ng ffmpeg python3-pip \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev
          python3 -m pip install --break-system-packages -q numpy soundfile

      - name: JUCE 7.0.12
        run: git clone -q --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE7"

      - name: Budowanie
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZS_JUCE_PATH="$RUNNER_TEMP/JUCE7"
          cmake --build build --target ZsSymulacja

      - name: Symulacja
        run: |
          python3 Tools/zs-scenariusz.py "$RUNNER_TEMP/sym"
          ./build/ZsSymulacja_artefacts/Release/ZsSymulacja "$RUNNER_TEMP/sym" "$RUNNER_TEMP/raport.md"
          cat "$RUNNER_TEMP/raport.md" >> "$GITHUB_STEP_SUMMARY"
